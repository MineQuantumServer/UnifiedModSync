plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.141' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url = 'https://maven.hellfiredev.net/' }; maven { url = 'https://maven.theillusivec4.top/' }; maven { url = 'https://api.modrinth.com/maven' } }
sourceSets.main { java.srcDir '../../src/smoke/java'; resources.srcDir '../../src/smoke/resources' }
neoForge {
 version = '21.1.251'
 runs { smoke { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'ums_smoke' } }
 mods { ums_smoke { sourceSet sourceSets.main } }
}
dependencies {
 implementation files('../../build/libs/unified-mod-sync-neoforge-1.21.1-1.0.4.jar')
 compileOnly('com.mysql:mysql-connector-j:8.4.0') { transitive = false }
 additionalRuntimeClasspath('com.mysql:mysql-connector-j:8.4.0') { transitive = false }
 runtimeOnly('hellfirepvp.astralsorcery:AstralSorcery:2.0.0.4') { transitive = false }
 runtimeOnly('hellfirepvp.observerlib:ObserverLib:1.10.3.31') { transitive = false }
 runtimeOnly('top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1') { transitive = false }
 runtimeOnly('maven.modrinth:sophisticated-backpacks:AhPnzNtJ') { transitive = false }
 runtimeOnly('maven.modrinth:sophisticated-core:PXl6rB3q') { transitive = false }
 runtimeOnly('maven.modrinth:armourers-workshop:aXfzs8l3') { transitive = false }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
