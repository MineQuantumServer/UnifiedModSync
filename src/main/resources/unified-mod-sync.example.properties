# UTF-8. Configure MySQL and set enabled=true. Redis is OPTIONAL.
enabled=false
server-id=survival-1
sync-group=main
mysql.url=jdbc:mysql://127.0.0.1:3306/unified_sync?sslMode=PREFERRED&characterEncoding=UTF-8
mysql.user=unified_sync
mysql.password=
# Environment UMS_MYSQL_PASSWORD and UMS_REDIS_PASSWORD override these passwords.
redis.enabled=false
redis.host=127.0.0.1
redis.port=6379
redis.user=
redis.password=
redis.database=0
redis.tls=false
network-timeout-ms=3000
lease-seconds=90
join-delay-seconds=5
load-timeout-seconds=120
# auto: wait for KTG4 isLoaded() when installed; required: refuse if absent; off: only delay
ktg-mode=auto
# world: follow successful whole-server world saves; interval: independent timer
autosave-mode=world
# Used only when autosave-mode=interval
autosave-seconds=60
backup-count=10
max-backpacks=128
max-nesting-depth=8
modules=wardrobe,backpacks,astral
# First-ever database record only. Existing corrupt data NEVER falls back to local.
import-local=true
# Auth commands must remain usable while protected. /ums requires permission level 3.
protected-command-allowlist=login,l,register,reg,2fa
