plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '8.3.6'
}
group = 'dev.unifiedsync'
version = '1.0.5'
base { archivesName = 'unified-mod-sync-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = 'https://maven.hellfiredev.net/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://api.modrinth.com/maven' }
}
configurations { isolatedLibraries; implementation.extendsFrom isolatedLibraries }
sourceSets { smoke { compileClasspath += sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.runtimeClasspath } }
configurations { smokeImplementation.extendsFrom implementation; smokeRuntimeOnly.extendsFrom runtimeOnly }
neoForge {
    version = '21.1.251'
    runs { smoke { type = 'gameTestServer'; sourceSet = sourceSets.smoke; systemProperty 'neoforge.enabledGameTestNamespaces', 'ums_smoke' } }
    mods { unifiedsync { sourceSet sourceSets.main }; ums_smoke { sourceSet sourceSets.smoke } }
}
dependencies {
    isolatedLibraries('com.mysql:mysql-connector-j:9.2.0') { transitive = false }
    isolatedLibraries('redis.clients:jedis:5.2.0') { transitive = false }
    isolatedLibraries('org.apache.commons:commons-pool2:2.12.0') { transitive = false }
    additionalRuntimeClasspath('com.mysql:mysql-connector-j:9.2.0') { transitive = false }
    additionalRuntimeClasspath('redis.clients:jedis:5.2.0') { transitive = false }
    additionalRuntimeClasspath 'org.apache.commons:commons-pool2:2.12.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    smokeImplementation sourceSets.main.output
    runtimeOnly('hellfirepvp.astralsorcery:AstralSorcery:2.0.0.4') { transitive = false }
    runtimeOnly('hellfirepvp.observerlib:ObserverLib:1.10.3.31') { transitive = false }
    runtimeOnly('top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1') { transitive = false }
    runtimeOnly('maven.modrinth:sophisticated-backpacks:AhPnzNtJ') { transitive = false }
    runtimeOnly('maven.modrinth:sophisticated-core:PXl6rB3q') { transitive = false }
    runtimeOnly('maven.modrinth:armourers-workshop:aXfzs8l3') { transitive = false }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform(); if (project.hasProperty('integration')) systemProperty 'ums.integration', 'true' }
jar { archiveClassifier = 'unshaded-dev-only' }
shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.isolatedLibraries]
    relocate 'com.mysql', 'dev.unifiedsync.internal.mysql'
    relocate 'redis.clients.jedis', 'dev.unifiedsync.internal.jedis'
    relocate 'org.apache.commons.pool2', 'dev.unifiedsync.internal.pool2'
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/INDEX.LIST', 'META-INF/services/java.sql.Driver'
    manifest.attributes('Automatic-Module-Name': 'dev.unifiedsync', 'Implementation-Version': project.version)
    from('LICENSE') { into 'META-INF/licenses'; rename { 'UNIFIED-SYNC-LICENSE' } }
}
assemble.dependsOn shadowJar
